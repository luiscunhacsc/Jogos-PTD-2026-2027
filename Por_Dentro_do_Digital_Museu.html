:root{color-scheme:dark;--bg:#0c1727;--panel:#13243a;--soft:#1c3149;--text:#edf1ef;--muted:#b5c5d1;--line:#42556b;--gold:#f2d395;--goldink:#172135;--ok:#a6ddca;--warn:#f0bab0;--focus:#f2d395;--shadow:0 18px 60px #0002}*{box-sizing:border-box}:root[data-theme=light]{color-scheme:light;--bg:#f4f1e9;--panel:#fffdf7;--soft:#eae8df;--text:#17283c;--muted:#4e6172;--line:#a8b4b9;--gold:#705015;--goldink:#fff;--ok:#23614f;--warn:#993e32;--focus:#705015;--shadow:0 15px 40px #192b3110}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button,select{color:var(--text);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 16px}button{cursor:pointer;font-weight:650}button:hover:not(:disabled){border-color:var(--gold)}button:disabled{opacity:.45;cursor:default}button.primary{background:var(--gold);color:var(--goldink);border-color:var(--gold)}button.small{font-size:.8rem;padding:7px 12px}a{color:var(--gold)}:focus-visible{outline:3px solid var(--focus);outline-offset:4px}[hidden]{display:none!important}h1,h2,h3{line-height:1.16}h1,h2,.serif{font-family:Georgia,'Times New Roman',serif;font-weight:400}h1{font-size:clamp(2.8rem,5.5vw,5.5rem);letter-spacing:-.045em;margin:15px 0 23px}h2{font-size:clamp(1.9rem,3.3vw,2.8rem);letter-spacing:-.025em;margin:14px 0 22px}h3{font-size:1.2rem}p{margin:12px 0}.muted,small{color:var(--muted)}.eyebrow{font:600 .73rem/1.5 ui-monospace,monospace;text-transform:uppercase;letter-spacing:.15em;color:var(--gold)}.wrap{max-width:1220px;padding:0 32px;margin:auto}.top{border-bottom:1px solid var(--line)}.top>.wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:86px}.brand{font-family:Georgia,serif;font-size:1.3rem}.brand span{display:block;font:400 .62rem/1.3 system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}.tools,.actions{display:flex;gap:10px;align-i border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem}.token.won{background:var(--gold);color:var(--goldink)}.bigchoice{display:grid;grid-template-columns:1fr 1fr;gap:20px}.rewardflash{font:400 2rem Georgia,serif;margin:15px 0;min-height:48px;color:var(--gold)}.feed{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.feedcard{border:1px solid var(--line);border-top:3px solid var(--view);padding:13px;border-radius:8px;background:var(--panel);font-size:.85rem}.feedcard small{display:block;font-size:.7rem;margin-bottom:8px}.distribution{display:flex;height:24px;overflow:hidden;border-radius:6px;margin:18px 0}.distribution span{min-width:0;display:flex;align-items:center;justify-content:center;color:#132238;font-size:.75rem;font-weight:700}.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:.8rem}.legend span:before{content:'';display:inline-block;width:10px;height:10px;background:var(--view);margin-right:7px;border-radius:2px}.perm{display:grid;grid-template-columns:1fr auto;gap:20px;border-bottom:1px solid var(--line);padding:18px 0}.perm:last-child{border:0}.perm h3{margin:0 0 8px}.perm p{margin:4px 0;font-size:.9rem}.perm button{align-self:start;min-width:115px}.perm button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}.doc{border:1px solid var(--line);padding:16px;border-radius:8px;margin:12px 0;background:var(--soft)}.doc p{font-size:.9rem}.aianswer{border-left:3px solid #9caeef;padding:14px 18px;background:var(--soft);margin:15px 0}.aianswer b{display:block;font-size:.75rem;color:var(--muted);margin-bottom:8px}.classify{display:flex;gap:8px;flex-wrap:wrap}.classify button{font-size:.8rem}.classify button[aria-pressed=true]{border:2px solid var(--gold);padding:9px 15px}.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.passportcard{border:1px solid var(--line);padding:24px;border-radius:12px;background:var(--panel)}.stamp{border:2px solid var(--gold);border-radius:50%;width:85px;height:85px;display:grid;place-content:center;text-align:center;color:var(--gold);font:400 1.8rem Georgia,serif;margin-bottom:18px}.stamp small{font:600 .55rem system-ui,sans-serif;letter-spacing:.12em}.passportcard.pending{opacity:.6}.journal{white-space:pre-wrap;overflow-wrap:anywhere}.footer{border-top:1px solid var(--line);padding:28px 0;margin-top:50px;color:var(--muted);font-size:.78rem}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.printonly{display:none}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:12px 8px;text-align:left;border-bottom:1px solid var(--line)}.tablewrap{overflow-x:auto}.checkedlabel{padding:12px 0}body[data-motion=off] *{animation:none!important;transition:none!important;scroll-behavior:auto!important}

const ROOMS=[
{id:'attention',n:'01',title:'A atenção em disputa',short:'Experimenta o custo de mudar de tarefa.',cp:'CP1 · Fatores humanos / CP2.1 · Comportamento digital',color:'#96d9ee',concept:'Atenção e alternância',prediction:'Em que condição esperas terminar a tarefa com maior facilidade?',pred:['Sem mensagens intermédias.','Com mensagens intermédias.','Não prevejo uma diferença clara.'],intro:'Vais classificar números como pares ou ímpares em duas rondas curtas. Numa delas aparecerão duas mensagens fictícias. A ordem das condições varia entre visitas.',observation:'Compara tempo e erros, mas considera também a prática, a ordem das rondas e o esforço de clicar nas mensagens.',concepts:[['Atenção seletiva','Selecionar informação relevante implica gerir estímulos concorrentes. Um aviso pode captar a atenção mesmo quando não ajuda a tarefa.'],['Alternância entre tarefas','Parar uma atividade, tratar outra e retomar a primeira pode exigir reorientação. A experiência inclui também o tempo mecânico de abrir e fechar mensagens.'],['Uma comparação não é uma prova','Duas rondas individuais não isolam mecanismos psicológicos. Prática, números apresentados, contexto e ordem podem influenciar os resultados.']],pitfall:'Mais lentidão nesta experiência não significa menor capacidade de atenção. Ausência de diferença também não demonstra ausência de custos no quotidiano.',transfer:'Uma equipa quer avaliar se notificações prejudicam a revisão de documentos. Qual desenho permite uma comparação mais informativa?',choices:[['Alternar condições entre participantes, usando tarefas equivalentes.','Ajuda a distribuir efeitos de ordem e a reduzir diferenças entre tarefas. Continua a ser necessário definir medidas e controlar condições relevantes.'],['Pedir primeiro uma tarefa sem avisos e depois outra mais difícil com avisos.','A dificuldade e a ordem confundem-se com as notificações. Uma diferença não poderia ser atribuída apenas aos avisos.'],['Comparar quem escolhe trabalhar com avisos com quem prefere desligá-los.','Pode mostrar diferenças entre grupos, mas as preferências e outras características também podem explicar os resultados.']],best:0,bridge:'Na prática: combinar indicadores de desempenho com contexto, em vez de diagnosticar a partir de uma tarefa breve.'},
{id:'mirror',n:'02',title:'O espelho social',short:'Descobre o que ficou fora do enquadramento.',cp:'CP2.1 · Identidade e interação social',color:'#d5b8f3',concept:'Apresentação de si',prediction:'Um perfil com três momentos de sucesso permite concluir o quê sobre a semana da pessoa?',pred:['Que a maioria da semana correu bem.','Que foram escolhidos três momentos positivos.','Que a pessoa tentou enganar quem a segue.'],intro:'O perfil da Inês é fictício. Começa por observar três publicações. Depois abre a cronologia e constrói uma versão diferente do mesmo perfil.',observation:'Há uma diferença entre o que foi publicado, o conjunto disponível e o que imaginas sobre a vida da pessoa.',concepts:[['Seleção e enquadramento','Um perfil mostra escolhas editoriais: momentos, imagens, palavras e destinatários. Uma seleção positiva não permite descrever a totalidade da vida.'],['Comparação social','Podemos usar outras pessoas como referência. Comparar o nosso quotidiano com momentos selecionados de outra pessoa pode produzir uma comparação assimétrica.'],['Identidade e intenção','Apresentar uma faceta de si não é, por si, mentir. A intenção, a experiência íntima e a reação do público não podem ser lidas diretamente a partir das publicações.']],pitfall:'Conhecer os episódios omitidos também não revela toda a pessoa: a cronologia é uma amostra fictícia, não uma biografia completa.',transfer:'Uma estudante diz: «Os meus colegas publicam conquistas; sou a única a ter dificuldades.» Que primeiro passo promove uma reflexão mais rigorosa?',choices:[['Explorar que informação vê e o que está a inferir sobre os colegas.','Distinguir informação observada de inferências permite discutir a comparação sem negar o sentimento da estudante.'],['Explicar que os colegas publicam sucessos para esconder inseguranças.','A explicação atribui uma intenção sem evidência. Uma interpretação aparentemente tranquilizadora pode continuar a ser especulativa.'],['Comparar o número de publicações positivas de todos os colegas.','A contagem descreve publicações, mas não mede as dificuldades ou o bem-estar de cada pessoa.']],best:0,bridge:'Na prática: validar a experiência da pessoa e questionar a qualidade da comparação.'},
{id:'rewards',n:'03',title:'A máquina de recompensas',short:'Duas sequências. A mesma quantidade final.',cp:'CP1 · Arquiteturas digitais / CP2.1 · Gamificação',color:'#f2cf8b',concept:'Recompensas e expectativas',prediction:'Qual sequência achas que despertará maior vontade de continuar?',pred:['A que distribui recompensas regularmente.','A que distribui recompensas em momentos variáveis.','Não sei; pode depender da pessoa e do contexto.'],intro:'Experimenta duas sequências de 12 ações. Ambas terminam ao fim dessas ações. Os símbolos recebidos não têm valor nem dão pontos ao passaporte.',observation:'Compara a distribuição, o total recebido e a tua vontade declarada de continuar. São informações diferentes.',concepts:[['Razão fixa e variabilidade','A usa a lógica de razão fixa: um símbolo a cada três ações. B varia o número de ações entre símbolos. Não são esquemas definidos pelo tempo. A sequência B foi preparada, não é sorteada a cada clique.'],['Recompensa não é automaticamente reforço','Em sentido comportamental, uma consequência é reforçadora se aumentar a probabilidade futura do comportamento. Entregar um símbolo, isoladamente, não demonstra esse efeito.'],['Envolvimento e autonomia','As expectativas podem influenciar o envolvimento, mas a reação varia. Um desenho responsável permite compreender as regras e parar sem perdas artificiais.']],pitfall:'Esta atividade não demonstra dependência, não mede dopamina e não permite concluir que recompensas variáveis motivam todas as pessoas.',transfer:'Uma escola quer manter a motivação num recurso de estudo. Qual proposta aproxima melhor as recompensas do objetivo educativo?',choices:[['Dar feedback sobre competências e permitir terminar sessões sem penalização.','Liga o progresso à aprendizagem e preserva a possibilidade de fazer pausas. A motivação deve ser avaliada, não presumida.'],['Aumentar a imprevisibilidade dos prémios e medir o tempo de permanência.','Pode aumentar consultas, mas o tempo de permanência não demonstra aprendizagem. O desenho pode criar pressão para continuar.'],['Premiar os acessos diários e retirar distintivos após uma ausência.','A regularidade pode ajudar algumas pessoas, mas a ameaça de perder progresso penaliza pausas e pode deslocar o objetivo para manter a sequência.']],best:0,bridge:'Na prática: avaliar o que os incentivos fazem aprender e não apenas quantas vezes fazem regressar.'},
{id:'bubble',n:'04',title:'A bolha que construímos',short:'Muda escolhas e regras. Observa o feed.',cp:'CP2.3 · Personalização e câmaras de eco',color:'#a6ddca',concept:'Seleção da informação',prediction:'Se uma plataforma privilegiar conteúdos semelhantes aos que escolhes, o que esperas observar?',pred:['Uma distribuição de perspetivas mais concentrada.','Uma melhoria automática da qualidade das fontes.','Uma descrição fiel da opinião da população.'],intro:'Seleciona três conteúdos sobre ensino digital. Depois regula a personalização de um feed fictício e compara-o com uma distribuição equilibrada de perspetivas.',observation:'Os números apresentados contam cartões no feed. Não medem a verdade das afirmações, a opinião pública ou o efeito nas tuas crenças.',concepts:[['Escolhas e recomendação','O feed depende tanto das escolhas iniciais como da regra que distribui os conteúdos. Ao variar um elemento mantendo o outro, podes explorar o mecanismo do modelo.'],['Exposição e reforço social','A filtragem pode estreitar a diversidade de exposição. Uma câmara de eco envolve também relações e práticas sociais que reforçam opiniões e desvalorizam posições discordantes.'],['Diversidade não garante qualidade','Mostrar perspetivas diferentes não torna todas igualmente sustentadas. É necessário verificar fontes e evidência, evitando confundir pluralidade com equivalência factual.']],pitfall:'O simulador usa três categorias simples e uma regra transparente. Não reproduz o algoritmo de uma rede real nem prevê mudanças de opinião.',transfer:'Um grupo recebe quase só conteúdos que confirmam a sua posição. Qual investigação distinguiria melhor a contribuição da plataforma da contribuição das escolhas?',choices:[['Comparar recomendações com regras diferentes, mantendo as escolhas iniciais.','A comparação permite isolar a regra no modelo. Num estudo real seriam necessários outros controlos e dados sobre a exposição efetiva.'],['Contar as publicações com que os membros dizem concordar.' function sanitizeLab(id,l){if(!l||typeof l!=='object'||Array.isArray(l))throw Error('Atividade inválida');let o={};
if(id==='attention'){o.order=Array.isArray(l.order)&&l.order.length===2&&new Set(l.order).size===2&&l.order.every(x=>['quiet','messages'].includes(x))?l.order:['quiet','messages'];o.untimed=l.untimed===true;o.results={};for(const k of ['quiet','messages']){const x=l.results?.[k];if(x&&Number.isFinite(x.time)&&x.time>=0&&x.time<=86400000&&validInt(x.errors,0,8)&&typeof x.timed==='boolean')o.results[k]={time:x.time,errors:x.errors,timed:x.timed}}}

if(id==='rewards'){o.a=validInt(l.a,0,12)?l.a:0;o.b=validInt(l.b,0,12)?l.b:0;o.ratingA=validInt(l.ratingA,1,5)?l.ratingA:null;o.ratingB=validInt(l.ratingB,1,5)?l.ratingB:null}
if(id==='bubble'){o.selected=ints(l.selected,0,8,3)&&new Set(l.selected).size===l.selected.length?l.selected:[];o.level=validInt(l.level,0,100)?l.level:80;o.diverse=l.diverse===true;o.runs=Array.isArray(l.runs)?l.runs.slice(-8).filter(x=>x&&ints(x.counts,0,12,3)&&x.counts.length===3&&x.counts.reduce((a,b)=>a+b,0)===12&&validInt(x.level,0,100)&&typeof x.diverse==='boolean').map(x=>({counts:x.counts,level:x.level,diverse:x.diverse})):[];o.generated=l.generated===true&&o.selected.length===3}
if(id==='privacy'){o.flags=Array.isArray(l.flags)&&l.flags.length===5&&l.flags.every(x=>typeof x==='boolean')?l.flags:[false,false,false,false,false];o.audits=Array.isArray(l.audits)?l.audits.filter(x=>typeof x==='string'&&/^[01]{5}$/.test(x)).slice(-8):[];o.report=l.report===true}
if(id==='ai'){o.docs=ints(l.docs,0,2,3)?[...new Set(l.docs)]:[];o.labels=Array.isArray(l.labels)&&l.labels.length===4&&l.labels.every(x=>x===null||validInt(x,0,2))?l.labels:[null,null,null,null];o.checked=l.checked===true&&o.labels.every(x=>x!==null);o.tone=l.tone===true}
return o}
function sanitize(x){if(!x||x.app!=='museu-psicodigital'||x.version!==VERSION||!x.rooms||typeof x.rooms!=='object')throw Error('Formato inválido');const out={theme:x.theme==='light'?'light':'dark',motion:x.motion===true,rooms:{}};for(const r of ROOMS){const d=x.rooms[r.id]||blank();if(typeof d!=='object'||Array.isArray(d))throw Error('Sala inválida');const z=blank();z.pred=validInt(d.pred,0,2)?d.pred:null;z.lab=sanitizeLab(r.id,d.lab||{});z.note=typeof d.note==='string'?d.note.slice(0,1500):'';z.observed=d.observed===true;z.understood=d.understood===true;z.choice=validInt(d.choice,0,2)?d.choice:null;z.done=d.done===true&&z.pred!==null&&ready(r.id,z.lab)&&z.observed&&z.understood&&z.choice!==null;z.date=typeof d.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d.date)?d.date:'';z.step=validInt(d.step,0,4)?Math.min(d.step,maxStep(r.id,z)):0;out.rooms[r.id]=z}return out}

function map(){notice('');cancelTrial();current=null;screen='map';const done=ROOMS.filter(r=>S.rooms[r.id].done).length;$('view').innerHTML=`<section class="hero"><div><div class="eyebrow">Psicologia · Experiências para pensar</div><h1>Entra. Experimenta.<br>Olha outra vez.</h1><p>O digital faz parte da nossa vida. Neste museu, podes parar, alterar as condições e descobrir o que está por trás de uma experiência.</p><div class="actions"><button id="begin" class="primary">${done===6?'Voltar a explorar':ROOMS.some(r=>S.rooms[r.id].pred!==null)?'Continuar a visita':'Começar a visita'}</button><button id="openPass">O meu passaporte · ${done}/6</button></div></div><div class="portal" aria-hidden="true"><svg viewBox="0 0 360 360" fill="none"><path d="M75 300V145a105 105 0 01210 0v155M96 300V146a84 84 0 01168 0v154M119 300V148a61 61 0 01122 0v152M143 300V150a37 37 0 0174 0v150" stroke="#7c99aa"/><path d="M55 300h250M110 264h140M131 236h98" stroke="#415b71"/><circle cx="180" cy="142" r="19" fill="#f2d395"/><path d="M180 166v94" stroke="#f2d395"/><circle cx="62" cy="212" r="4" fill="#a6ddca"/><circle cx="298" cy="212" r="4" fill="#d5b8f3"/></svg><span class="caption">UM MUSEU FEITO DE PERGUNTAS</span></div></section><div class="rule"><span>6 salas · cerca de 5–10 minutos por sala · ao teu ritmo</span><span>${done} de 6 salas exploradas · Sem classificação pública</span></div><div class="sectionhead"><h2>Escolhe uma porta.</h2><span class="muted">Podes visitar as salas pela ordem que preferires.</span></div><section class="grid">${ROOMS.map((r,i)=>`<article class="roomcard" style="--room:${r.color}"><div class="art"><span class="number">SALA ${r.n}</span>${icon(i)}</div><div class="cardbody"><h3>${r.title}</h3><p>${r.short}</p><span class="stampmini">${S.rooms[r.id].done?'◇ Carimbo no passaporte':S.rooms[r.id].pred!==null?'Visita em curso':'Uma nova perspetiva'}</span><button data-room="${r.id}">${S.rooms[r.id].done?'Revisitar sala':'Entrar na sala'} →</button></div></article>`).join('')}</section><details><summary>Como funciona a visita</summary><p>Cada sala segue cinco momentos: <strong>prevê, experimenta, observa, explica e transfere</strong>. A previsão é um ponto de partida; não vale pontos. No fim, recebes um carimbo pela exploração e podes guardar uma reflexão no passaporte.</p><p>As experiências são demonstrações didáticas. Os dados e as pessoas apresentados são fictícios. As tuas respostas não permitem diagnosticar capacidades, personalidade ou saúde mental. Não há limites de tempo obrigatórios nem recompensas por permanecer ligado.</p><p>As etapas guardam-se neste navegador. Na sala da atenção, sair interrompe apenas a ronda em curso; resultados de rondas concluídas ficam guardados. Usa o passaporte para exportar o progresso e transportá-lo.</p></details><details><summary>Para o docente · enquadramento e utilização em aula</summary><p>Recurso complementar ao banco de questões e à FUC de <em>Psicologia na Transição Digital, 2026–2027</em>. Trabalha fatores humanos, identidade, gamificação, literacia crítica, dados e IA. Os seis percursos selecionam temas da UC; o passaporte documenta exploração, não certifica domínio ou competência profissional.</p><p>Em pares: prever individualmente, experimentar em conjunto e comparar interpretações. No plenário: pedir uma observação, uma explicação alternativa e uma proposta de investigação. Os modelos explicitam os seus limites para evitar a transformação de experiências breves em «testes psicológicos».</p><p>Na sala da atenção, a ordem varia e as tarefas têm comprimento semelhante; isso não equivale a um estudo controlado. Na sala de recompensas, os dois totais são iguais. O feed usa uma regra transparente; as respostas de IA são textos preparados, sem ligação a um modelo.</p><p>Referências de enquadramento usadas na preparação: banco de questões e FUC fornecidos; <a href="https://commission.europa.eu/law/law-topic/data-protection/information-business-and-organisations/principles-gdpr_en" target="_blank" rel="noopener">Comissão Europeia — princípios de tratamento de dados pessoais</a>; <a href="https://digital-strategy.ec.europa.eu/en/policies/european-approach-artificial-intelligence" target="_blank" rel="noopener">Comissão Europeia — abordagem à IA</a>. As ligações externas precisam de Internet; as atividades funcionam localmente.</p></details>`;document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>openRoom(b.dataset.room));$('begin').onclick=()=>openRoom((ROOMS.find(r=>!S.rooms[r.id].done)||ROOMS[0]).id);$('openPass').onclick=passport;}
function ready(id,l){if(id==='attention')return !!(l.results?.quiet&&l.results?.messages);if(id==='mirror')return !!l.compared;if(id==='rewards')return l.a===12&&l.b===12&&!!l.ratingA&&!!l.ratingB;if(id==='bubble')return (l.runs?.length||0)>=2&&new Set(l.runs.map(r=>r.level+'-'+r.diverse)).size>=2;if(id==='privacy')return new Set(l.audits||[]).size>=2;if(id==='ai')return !!l.checked;return false}
function maxStep(id,d){if(d.pred===null)return 0;if(!ready(id,d.lab))return 1;if(!d.observed)return 2;if(!d.understood)return 3;return 4}
function openRoom(id){notice('');cancelTrial();current=id;screen='room';const d=S.rooms[id];if(!Object.keys(d.lab).length){d.lab=sanitizeLab(id,{});if(id==='attention'&&Math.random()<.5)d.lab.order.reverse()}save();renderRoom();focusView()}
function renderRoom(){const r=ROOMS.find(r=>r.id===current),d=S.rooms[current];d.step=Math.min(d.step,maxStep(current,d));$('view').innerHTML=`<section class="roomhead"><div><div class="eyebrow">Sala ${r.n} · ${r.concept}</div><h1>${r.title}</h1><p>${r.cp}</p></div><div class="seal">${r.n}<small>${d.done?'EXPLORADA':'EXPLORA'}</small></div></section><nav class="steps" aria-label="Etapas da sala">${STAGES.map((s,i)=>`<button class="step" data-step="${i}" ${i>maxStep(current,d)?'disabled':''} ${i===d.step?'aria-current="step"':''}><span>0${i+1}</span>${s}</button>`).join('')}</nav><section class="content" id="stage"></section>`;document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{if(trial&&!confirm('Sair da ronda em curso? Terás de reiniciar esta ronda.'))return;cancelTrial();d.step=+b.dataset.step;save();renderRoom()});renderStage(r,d)}
function forward(){const d=S.rooms[current];d.step=Math.min(4,d.step+1);save();renderRoom();$('stage').scrollIntoView({block:'start',behavior:'instant'})}
function renderStage(r,d){const box=$('stage');if(d.step===0){box.innerHTML=`<div class="eyebrow">Antes de experimentar</div><h2>${r.prediction}</h2><p class="intro">Escolhe a tua previsão. Não há pontuação nesta etapa: vais compará-la com o que observares.</p><div class="choices">${r.pred.map((s,i)=>`<button class="choice" data-pred="${i}" aria-pressed="${d.pred===i}"><span class="key">${'ABC'[i]}</span><span>${s}</span></button>`).join('')}</div><div class="panel"><p>${r.intro}</p></div><div class="footnav"><span></span><button class="primary" id="next" ${d.pred===null?'disabled':''}>Entrar na experiência →</button></div>`;document.querySelectorAll('[data-pred]').forEach(b=>b.onclick=()=>{d.pred=+b.dataset.pred;save();renderStage(r,d);document.querySelector('[data-pred="'+d.pred+'"]').focus()});$('next').onclick=forward;return}
if(d.step===1){box.innerHTML=`<div id="lab"></div><div class="footnav"><button id="resetLab" class="small">Reiniciar esta experiência</button><button id="next" class="primary" ${ready(r.id,d.lab)?'':'disabled'}>Observar os resultados →</button></div><p class="muted" id="labRequirement" style="font-size:.83rem"></p>`;renderLab(r,d);$('next').onclick=forward;$('resetLab').onclick=()=>{if(confirm('Reiniciar esta experiência e retirar o carimbo desta sala? A tua previsão e reflexão serão mantidas.')){cancelTrial();d.lab=sanitizeLab(r.id,{});if(r.id==='attention'&&Math.random()<.5)d.lab.order.reverse();d.observed=false;d.understood=false;d.choice=null;d.done=false;d.date='';save();renderRoom()}};return}
if(d.step===2){box.innerHTML=`<div class="eyebrow">O que aconteceu aqui?</div><h2>Observa antes de explicar.</h2><div class="panel"><h3>A tua previsão</h3><p>${esc(r.pred[d.pred])}</p></div><div class="panel"><h3>Registo da experiência</h3>${summary(r.id,d.lab)}</div><p class="intro">${r.observation}</p><label for="note"><strong>Caderno de visita · opcional</strong></label><p class="muted" style="font-size:.85rem">Uma observação, uma surpresa ou uma dúvida. Regista ideias gerais, sem nomes ou dados pessoais.</p><textarea id="note" maxlength="1500" placeholder="Observei… Ainda não posso concluir…">${esc(d.note)}</textarea><small id="savedNote">A reflexão fica guardada neste dispositivo.</small><div class="footnav"><button id="backLab">Voltar a experimentar</button><button class="primary" id="next">Li o balanço · compreender →</button></div>`;$('note').oninput=e=>{d.note=e.target.value;save();$('savedNote').textContent=saved?'Reflexão guardada.':'Exporta o progresso para guardar a reflexão.'};$('backLab').onclick=()=>{d.step=1;save();renderRoom()};$('next').onclick=()=>{d.observed=true;forward()};return}
if(d.step===3){box.innerHTML=`<div class="eyebrow">Três ideias para levar contigo</div><h2>O mecanismo e os seus limites.</h2><div class="concepts">${r.concepts.map((c,i)=>`<article class="item"><b>0${i+1}</b><h3>${c[0]}</h3><p>${c[1]}</p></article>`).join('')}</div><div class="feedback"><strong>Evita este salto</strong><p>${r.pitfall}</p></div><p class="intro">${r.bridge}</p><div class="footnav"><span></span><button id="next" class="primary">Aplicar a outra situação →</button></div>`;$('next').onclick=()=>{d.understood=true;forward()};return}
const ix=ROOMS.indexOf(r),order=[0,1,2].map(n=>(n+ix+1)%3);box.innerHTML=`<div class="eyebrow">Uma nova situação</div><h2>${r.transfer}</h2><div class="choices">${order.map((k,i)=>`<button class="choice" data-transfer="${k}" aria-pressed="${d.choice===k}" ${d.choice!==null?'disabled':''}><span class="key">${'ABC'[i]}</span><span>${r.choices[k][0]}</span></button>`).join('')}</div><div id="transferFeedback" aria-live="polite">${d.choice!==null?`<div class="feedback ${d.choice===r.best?'ok':'warn'}"><strong>${d.choice===r.best?'Uma proposta bem sustentada.':'Vale a pena rever este raciocínio.'}</strong><p>${r.choices[d.choice][1]}</p>${d.choice!==r.best?`<p><strong>Uma alternativa mais robusta:</strong> ${r.choices[r.best][0]} ${r.choices[r.best][1]}</p>`:''}</div><details><summary>Comparar o raciocínio das três propostas</summary>${r.choices.map(c=>`<p><strong>${c[0]}</strong><br>${c[1]}</p>`).join('')}</details>`:''}</div><div class="footnav">${d.choice!==null?'<button id="tryTransfer">Voltar a refletir</button>':'<span></span>'}<button id="stamp" class="primary" ${d.choice===null?'disabled':''}>${d.done?'Voltar ao passaporte':'Carimbar o passaporte'} ◇</button></div><small>O carimbo assinala que exploraste a sala e consultaste o feedback. Não é uma nota de avaliação.</small>`;document.querySelectorAll('[data-transfer]').forEach(b=>b.onclick=()=>{d.choice=+b.dataset.transfer;save();renderStage(r,d);$('transferFeedback').tabIndex=-1;$('transferFeedback').focus({preventScroll:true})});if($('tryTransfer'))$('tryTransfer').onclick=()=>{d.choice=null;d.done=false;save();renderStage(r,d)};$('stamp').onclick=()=>{d.done=true;d.date=new Date().toLocaleDateString('sv-SE');save();passport();focusView()}}
function updateReady(){const d=S.rooms[current];if($('next'))$('next').disabled=!ready(current,d.lab);const messages={attention:'Conclui as duas rondas. Podes optar por não medir o tempo.',mirror:'Abre a cronologia, altera pelo menos uma publicação e compara um perfil com três momentos.',rewards:'Conclui as duas sequências e regista a vontade de continuar em cada uma.',bubble:'Gera e compara pelo menos duas configurações diferentes de personalização ou diversidade.',privacy:'Audita duas configurações de permissões diferentes.',ai:'Classifica as quatro respostas e consulta a análise.'};if($('labRequirement'))$('labRequirement').textContent=ready(current,d.lab)?'Experiência concluída. Podes continuar a explorar ou avançar para o balanço.':messages[current]}
function renderLab(r,d){({attention:attention,mirror:mirror,rewards:rewards,bubble:bubble,privacy:privacy,ai:ai})[r.id](d.lab);updateReady()}
function attention(l){const order=l.order||['quiet','messages'],next=order.find(k=>!l.results?.[k]);let body='';if(trial){const t=trial;if(t.paused){body=`<div class="panel center"><h3>Ronda em pausa</h3><p>O tempo de pausa não é contabilizado.</p><button id="resumeTrial" class="primary">Retomar a ronda</button></div>`}else{const alert=t.condition==='messages'&&[2,5].includes(t.index)&&!t.notices.includes(t.index);body=`<div class="panel"><div class="actions" style="justify-content:space-between"><span class="tag">${t.condition==='quiet'?'Sem mensagens':'Com mensagens simuladas'} · ${t.index+1}/8</span><button id="pauseTrial" class="small">Pausa</button></div>${alert?`<div class="notification" role="status"><strong>Mensagem fictícia da equipa</strong><p>${t.index===2?'«A reunião passou para as 15h. Podes confirmar que leste?»':'«Já está disponível a nova versão do documento.»'}</p><button id="dismiss">Marcar como lida e retomar</button></div>`:`<div class="tasknum" aria-label="Número a classificar: ${t.items[t.index]}">${t.items[t.index]}</div><div class="taskbuttons"><button data-parity="0">Par</button><button data-parity="1">Ímpar</button></div>`}<p class="muted center">${t.last||'Classifica o número. A primeira escolha fica registada.'}</p></div>`}}else body=`<div class="panel"><h3>${next?'Preparar a próxima ronda':'As duas rondas estão concluídas'}</h3><p>${next?'Classifica oito números. A precisão importa tanto como a rapidez. Na condição com mensagens, terás de marcar dois avisos como lidos antes de retomar.':'Compara os teus resultados no balanço. Não há desempenho mínimo nem pontos por rapidez.'}</p><label class="checkedlabel"><input id="untimed" type="checkbox" ${l.untimed?'checked':''} ${Object.keys(l.results||{}).length?'disabled':''}> Não medir o tempo · modo sem pressão temporal</label>${next?`<p><span class="tag">Próxima: ${next==='quiet'?'sem mensagens':'com mensagens'}</span></p><button id="startTrial" class="primary">Começar a ronda</button>`:''}</div>`;
$('lab').innerHTML=`<h2>Uma tarefa. Duas condições.</h2><p class="intro">Escolhe «Par» ou «Ímpar». A tarefa não é um teste clínico de atenção. Podes fazer uma pausa ou desligar a medição do tempo.</p>${body}${Object.keys(l.results||{}).length?`<div class="panel">${attentionSummary(l)}</div>`:''}`;
if($('untimed'))$('untimed').onchange=e=>{l.untimed=e.target.checked;save()};if($('startTrial'))$('startTrial').onclick=()=>{const items=Object.keys(l.results||{}).length?[29,36,51,42,68,73,85,94]:[42,37,65,28,91,54,76,83];trial={condition:next,items,index:0,errors:0,start:performance.now(),accum:0,paused:false,notices:[],last:''};attention(l)};if($('pauseTrial'))$('pauseTrial').onclick=pauseTrial;if($('resumeTrial'))$('resumeTrial').onclick=()=>{trial.paused=false;trial.start=performance.now();attention(l)};if($('dismiss'))$('dismiss').onclick=()=>{trial.notices.push(trial.index);attention(l)};document.querySelectorAll('[data-parity]').forEach(b=>b.onclick=()=>{const t=trial;if(!t||t.paused)return;const n=t.items[t.index],ok=n%2===+b.dataset.parity;t.errors+=ok?0:1;t.last=ok?'Classificação correta.':`${n} é ${n%2?'ímpar':'par'}. A resposta foi registada.`;t.index++;if(t.index===8){l.results=l.results||{};l.results[t.condition]={time:l.untimed?0:Math.round(t.accum+performance.now()-t.start),errors:t.errors,timed:!l.untimed};trial=null;save();attention(l);updateReady()}else{attention(l);const target=$('dismiss')||document.querySelector('[data-parity]');if(target)target.focus({preventScroll:true})}})}
function pauseTrial(){if(trial&&!trial.paused){trial.accum+=performance.now()-trial.start;trial.paused=true;if(current==='attention'&&S.rooms.attention.step===1)attention(S.rooms.attention.lab)}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseTrial()});
function attentionSummary(l){const row=k=>{const r=l.results?.[k];return r?`<tr><td>${k==='quiet'?'Sem mensagens':'Com mensagens'}</td><td>${r.errors} / 8</td><td>${r.timed?(r.time/1000).toFixed(1).replace('.',',')+' s':'Não medido'}</td></tr>`:''};return `<div class="tablewrap"><table><thead><tr><th>Condição</th><th>Erros</th><th>Tempo ativo total</th></tr></thead><tbody>${row('quiet')}${row('messages')}</tbody></table></div><p class="muted">Ordem: ${(l.order||[]).map(k=>k==='quiet'?'sem mensagens':'com mensagens').join(' → ')}. O tempo inclui ler e fechar avisos; pausas são excluídas. A diferença não separa custo motor, leitura, prática e alternância.</p>`}
function mirror(l){$('lab').innerHTML=`<h2>O perfil e o que ficou fora dele.</h2><p class="intro">Três publicações da Inês. Que história estás a construir a partir delas?</p><div class="threecol">${[0,1,2].map((k,i)=>`<article class="item"><div class="photo" aria-hidden="true">${icon(i)}</div><span class="tag">Publicação ${i+1}</span><h3>${EVENTS[k][0]}</h3><p>${EVENTS[k][1]}</p></article>`).join('')}</div><div class="actions" style="margin:24px 0"><button id="revealTimeline" class="primary">${l.revealed?'Cronologia aberta':'Abrir a cronologia da semana'}</button></div>${l.revealed?`<h3>Oito momentos disponíveis</h3><p class="muted">Constrói outro perfil com três momentos. Retira uma publicação e escolhe outra. Todas as situações são fictícias.</p><div class="timeline">${EVENTS.map((e,k)=>`<article class="item ${l.selected.includes(k)?'selected':''}"><span class="tag">${e[2]}</span><h3>${e[0]}</h3><p>${e[1]}</p><button class="small" data-event="${k}" aria-pressed="${l.selected.includes(k)}" ${!l.selected.includes(k)&&l.selected.length>=3?'disabled':''}>${l.selected.includes(k)?'Retirar do perfil':'Incluir no perfil'}</button></article>`).join('')}</div><div class="panel"><strong>${l.selected.length} de 3 publicações escolhidas</strong><p>${l.selected.map(k=>EVENTS[k][0]).join(' · ')||'Ainda não selecionaste momentos.'}</p><button id="compareProfile" class="primary" ${l.selected.length===3&&l.edits>0?'':'disabled'}>Comparar enquadramentos</button></div>${l.compared?`<div class="feedback"><strong>Duas seleções, a mesma semana fictícia.</strong><p>O perfil inicial mostra uma apresentação, um passeio e uma corrida. A tua seleção mostra: ${l.selected.map(k=>EVENTS[k][0].toLowerCase()).join('; ')}.</p><p>Em ambos os casos, ficam cinco momentos por mostrar. Uma mudança no perfil não significa que a vida da pessoa tenha mudado.</p></div>`:''}`:''}`;$('revealTimeline').onclick=()=>{l.revealed=true;save();mirror(l);updateReady()};document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{const k=+b.dataset.event;l.selected=l.selected.includes(k)?l.selected.filter(x=>x!==k):[...l.selected,k];l.edits=Math.min(999,(l.edits||0)+1);l.compared=false;save();mirror(l);updateReady();document.querySelector('[data-event="'+k+'"]').focus({preventScroll:true})});if($('compareProfile'))$('compareProfile').onclick=()=>{l.compared=true;save();mirror(l);updateReady()}}
const schedules={a:[3,6,9,12],b:[2,3,8,12]};
function rewards(l){$('lab').innerHTML=`<h2>O ritmo muda. O total mantém-se.</h2><p class="intro">Realiza 12 ações em cada máquina. Uma ação é apenas um clique. Observa quando surge um símbolo e regista a tua vontade de continuar. Podes parar a qualquer momento.</p><div class="bigchoice">${['a','b'].map(k=>{const n=l[k]||0,wins=schedules[k].filter(v=>v<=n).length;return `<section class="panel"><span class="eyebrow">Máquina ${k.toUpperCase()}</span><h3>${k==='a'?'Distribuição regular':'Distribuição variável'}</h3><p>${n} / 12 ações · ${wins} símbolos recebidos</p><div class="rewardrow" aria-label="Histórico das ações">${Array.from({length:n},(_,i)=>`<span class="token ${schedules[k].includes(i+1)?'won':''}" title="Ação ${i+1}: ${schedules[k].includes(i+1)?'símbolo':'sem símbolo'}">${schedules[k].includes(i+1)?'◇':'·'}</span>`).join('')}</div><div class="rewardflash" aria-live="polite">${n===0?'Pronto para começar':n===12?'Sequência concluída':schedules[k].includes(n)?'◇ Recebeste um símbolo':'Sem símbolo nesta ação'}</div><button data-reward="${k}" class="primary" ${n>=12?'disabled':''}>${n>=12?'12 ações concluídas':'Realizar uma ação'}</button>${n===12?`<label style="margin-top:18px" for="rating${k}">Se houvesse mais ações, que vontade terias de continuar?</label><select id="rating${k}" data-rating="${k}" style="width:100%;margin-top:8px"><option value="">Escolhe uma resposta</option>${[1,2,3,4,5].map(v=>`<option value="${v}" ${l[k==='a'?'ratingA':'ratingB']===v?'selected':''}>${v} · ${['Nenhuma','Pouca','Moderada','Bastante','Muita'][v-1]}</option>`).join('')}</select>`:''}</section>`}).join('')}</div>${l.a===12&&l.b===12?`<div class="panel"><h3>Abre a máquina: a regra era esta</h3><p><strong>A:</strong> símbolos nas ações 3, 6, 9 e 12. <strong>B:</strong> símbolos nas ações 2, 3, 8 e 12. Os intervalos da B foram preparados previamente.</p><p>Ambas deram quatro símbolos. Qualquer diferença que tenhas sentido não é prova de um efeito geral: não houve controlo da ordem, das expectativas ou de diferenças individuais.</p></div>`:''}`;document.querySelectorAll('[data-reward]').forEach(b=>b.onclick=()=>{const k=b.dataset.reward;if(l[k]<12)l[k]++;save();rewards(l);updateReady();document.querySelector('[data-reward="'+k+'"]').focus({preventScroll:true})});document.querySelectorAll('[data-rating]').forEach(b=>b.onchange=()=>{l[b.dataset.rating==='a'?'ratingA':'ratingB']=b.value?+b.value:null;save();updateReady()})}
function feedCounts(l){if(l.diverse)return [4,4,4];const preferences=[1,1,1];l.selected.forEach(k=>preferences[k%3]++);const mix=l.level/100,raw=preferences.map(n=>12*((1-mix)/3+mix*n/6)),counts=raw.map(Math.floor);let spare=12-counts.reduce((a,b)=>a+b,0);const order=[0,1,2].sort((a,b)=>(raw[b]-counts[b])-(raw[a]-counts[a])||a-b);for(let i=0;i<spare;i++)counts[order[i]]++;return counts}
const VIEWCOLORS=['#a6ddca','#eab6aa','#c0c9ff'];
function distribution(c){return `<div class="distribution" aria-label="Distribuição: ${c.map((n,i)=>VIEWS[i]+' '+n).join(', ')}">${c.map((n,i)=>`<span style="width:${n/12*100}%;background:${VIEWCOLORS[i]}">${n||''}</span>`).join('')}</div><div class="legend">${c.map((n,i)=>`<span style="--view:${VIEWCOLORS[i]}">${VIEWS[i]}: ${n}/12</span>`).join('')}</div>`}
function bubble(l){const titles=[['Acesso a bibliotecas digitais','Feedback imediato em exercícios','Prática autónoma com recursos interativos','Partilha de materiais entre estudantes','Recursos disponíveis fora da aula','Comunicação entre escolas distantes','Revisão com exemplos adicionais','Simulações para explorar ideias'],['Distração durante o estudo','Desigualdades de acesso à rede','Fadiga após longas sessões','Dependência de uma única plataforma','Dificuldades de acessibilidade','Pressão para estar sempre disponível','Custos dos equipamentos','Recolha de dados desnecessários'],['Objetivos antes de ferramentas','Formação e apoio aos utilizadores','Avaliar a aprendizagem obtida','Ajustar os recursos ao contexto','Articular digital e presencial','Garantir alternativas de acesso','Testar com utilizadores diferentes','Rever práticas a partir de evidências']];const counts=feedCounts(l);let cards=[];counts.forEach((n,k)=>{for(let i=0;i<n;i++)cards.push({v:k,title:titles[k][i]})});cards.sort((a,b)=>a.title.localeCompare(b.title,'pt'));$('lab').innerHTML=`<h2>Como se constrói este feed?</h2><p class="intro">Escolhe três conteúdos que consultarias. As categorias são simplificações didáticas, não rótulos de verdade ou falsidade.</p><div class="threecol">${TOPICS.map((t,i)=>`<button class="item ${l.selected.includes(i)?'selected':''}" data-topic="${i}" aria-pressed="${l.selected.includes(i)}" ${!l.selected.includes(i)&&l.selected.length>=3?'disabled':''} style="text-align:left"><span class="tag">${VIEWS[i%3]}</span><p>${t}</p><span style="font-size:.8rem">${l.selected.includes(i)?'✓ Selecionado':'Selecionar'}</span></button>`).join('')}</div><div class="panel"><h3>Regras de recomendação</h3><label for="personalization">Peso da personalização: <strong id="levelText">${l.level}%</strong></label><input id="personalization" type="range" min="0" max="100" step="10" value="${l.level}"><div class="rangeLabels"><span>Distribuição equilibrada</span><span>Mais afinidade com as escolhas</span></div><label class="checkedlabel"><input id="diverse" type="checkbox" ${l.diverse?'checked':''}> Garantir quatro cartões de cada perspetiva</label><button id="generateFeed" class="primary" ${l.selected.length===3?'':'disabled'}>Gerar e registar este feed</button><p class="muted" style="font-size:.82rem">A regra começa com um ponto por categoria e acrescenta um ponto por conteúdo escolhido. Mistura essa afinidade com a distribuição equilibrada. A opção de diversidade fixa quatro cartões por categoria.</p></div>${l.generated?`<h3>Feed atual · 12 cartões fictícios</h3>${distribution(counts)}<div class="feed" style="margin-top:20px">${cards.map(c=>`<article class="feedcard" style="--view:${VIEWCOLORS[c.v]}"><small>${VIEWS[c.v]}</small>${c.title}</article>`).join('')}</div>`:''}${l.runs.length?`<div class="panel"><h3>Configurações registadas</h3>${l.runs.map((x,i)=>`<p>${i+1}. Personalização ${x.level}%${x.diverse?' · diversidade garantida':''}: <strong>${x.counts.join(' / ')}</strong> cartões (potencialidades / limitações / condições).</p>`).join('')}<p class="muted">Se escolheste uma perspetiva de cada tipo, variar a personalização pode manter a distribuição. Isso é um resultado do modelo, não uma falha.</p></div>`:''}`;document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{const k=+b.dataset.topic;l.selected=l.selected.includes(k)?l.selected.filter(x=>x!==k):[...l.selected,k];l.generated=false;l.runs=[];save();bubble(l);updateReady()});$('personalization').oninput=e=>{l.level=+e.target.value;$('levelText').textContent=l.level+'%'};$('personalization').onchange=()=>{l.generated=false;save();bubble(l);updateReady();$('personalization').focus({preventScroll:true})};$('diverse').onchange=e=>{l.diverse=e.target.checked;l.generated=false;save();bubble(l);updateReady()};$('generateFeed').onclick=()=>{l.generated=true;const run={counts:feedCounts(l),level:l.level,diverse:l.diverse};if(!l.runs.some(x=>x.level===run.level&&x.diverse===run.diverse))l.runs.push(run);l.runs=l.runs.slice(-8);save();bubble(l);updateReady()}}
function privacy(l){$('lab').innerHTML=`<h2>Biblioteca de Bolso</h2><p class="intro">Objetivo: encontrar uma biblioteca, convidar alguém e procurar livros. Todas as permissões abaixo são opcionais neste modelo; as alternativas manuais mantêm os objetivos possíveis.</p><div class="actions"><button id="allOn">Experimentar todas as permissões</button><button id="allOff">Experimentar só o necessário</button></div><div class="panel">${PERMS.map((p,i)=>`<div class="perm"><div><h3>${p[0]}</h3><p><strong>Conveniência:</strong> ${p[1]}</p><p><strong>Alternativa:</strong> ${p[2]}</p><p class="muted">${p[3]}</p></div><button data-perm="${i}" aria-pressed="${l.flags[i]}" aria-label="${p[0]}: ${l.flags[i]?'permitido':'não permitido'}">${l.flags[i]?'✓ Permitir':'Não permitir'}</button></div>`).join('')}</div><div class="actions"><button id="audit" class="primary">Auditar esta configuração</button><span class="muted">${l.flags.filter(Boolean).length} / 5 permissões opcionais</span></div>${l.report?`<div class="panel"><h3>O que a tua configuração implica</h3>${l.flags.map((v,i)=>`<p><strong>${PERMS[i][0]}:</strong> ${v?PERMS[i][1]+' '+PERMS[i][3]:'Sem essa permissão. Alternativa: '+PERMS[i][2]}</p>`).join('')}<div class="feedback"><strong>O contrato ainda deixa perguntas em aberto</strong><p>Durante quanto tempo seriam conservados os dados? Quem poderia aceder? Haveria terceiros? Como poderiam ser alteradas as escolhas? Esta simulação não responde a essas perguntas.</p></div><p class="muted">Os botões não pedem permissões reais ao dispositivo e não recolhem dados de localização, contactos, áudio ou leitura.</p></div>`:''}${l.audits.length?`<p class="muted">${new Set(l.audits).size} configurações diferentes auditadas. ${l.audits.map(x=>x.split('').filter(v=>v==='1').length+' permissões').join(' → ')}.</p>`:''}`;const change=()=>{l.report=false;save();privacy(l);updateReady()};$('allOn').onclick=()=>{l.flags=[true,true,true,true,true];change()};$('allOff').onclick=()=>{l.flags=[false,false,false,false,false];change()};document.querySelectorAll('[data-perm]').forEach(b=>b.onclick=()=>{const i=+b.dataset.perm;l.flags[i]=!l.flags[i];change()});$('audit').onclick=()=>{const signature=l.flags.map(v=>v?'1':'0').join('');if(!l.audits.includes(signature))l.audits.push(signature);l.audits=l.audits.slice(-8);l.report=true;save();privacy(l);updateReady()}}
function ai(l){const labels=['Sustentada pelo dossier','Extrapola o dossier','Contraria o dossier'];$('lab').innerHTML=`<h2>A certeza está no tom ou na evidência?</h2><p class="intro">Abre os documentos e classifica cada afirmação. «Extrapola» significa que a evidência disponível não permite a conclusão. Não equivale necessariamente a «falsa».</p><div class="panel"><h3>Dossier de verificação · documentos fictícios</h3>${DOCS.map((doc,i)=>`<details data-doc="${i}" ${l.docs.includes(i)?'open':''}><summary>${doc[0]}</summary><p>${doc[1]}</p></details>`).join('')}<label class="checkedlabel"><input type="checkbox" id="tone" ${l.tone?'checked':''}> Mostrar um tom mais confiante nas respostas</label><small>O conteúdo das afirmações mantém-se. O enquadramento verbal muda.</small></div>${CLAIMS.map((c,i)=>`<article class="item" style="margin:15px 0"><span class="tag">Resposta ${i+1} · assistente simulado</span><div class="aianswer"><b>${l.tone?'Resposta apresentada com grande segurança':'Resposta a verificar'}</b>${c[0]}</div><div class="classify" role="group" aria-label="Classificar resposta ${i+1}">${labels.map((name,k)=>`<button data-claim="${i}" data-label="${k}" aria-pressed="${l.labels[i]===k}" ${l.checked?'disabled':''}>${name}</button>`).join('')}</div>${l.checked?`<div class="feedback ${l.labels[i]===c[1]?'ok':'warn'}"><strong>${l.labels[i]===c[1]?'Classificação adequada':'Revê a relação com a evidência'}</strong><p>${c[2]}</p></div>`:''}</article>`).join('')}<button id="checkAI" class="primary" ${l.checked||l.labels.some(v=>v===null)?'disabled':''}>${l.checked?'Análise consultada':'Confrontar com o dossier'}</button>${l.checked?`<p class="muted">${l.labels.filter((v,i)=>v===CLAIMS[i][1]).length} de 4 classificações coincidem com a análise do dossier. Este resultado refere-se apenas a estas quatro afirmações.</p>`:''}`;document.querySelectorAll('[data-doc]').forEach(el=>el.ontoggle=()=>{if(el.open&&!l.docs.includes(+el.dataset.doc)){l.docs.push(+el.dataset.doc);save()}});$('tone').onchange=e=>{l.tone=e.target.checked;save();ai(l);updateReady()};document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{l.labels[+b.dataset.claim]=+b.dataset.label;const k=b.dataset.claim,j=b.dataset.label;save();ai(l);updateReady();document.querySelector('[data-claim="'+k+'"][data-label="'+j+'"]').focus({preventScroll:true})});$('checkAI').onclick=()=>{l.checked=true;save();ai(l);updateReady()}}
function summary(id,l){if(id==='attention')return attentionSummary(l);if(id==='mirror')return `<p>Perfil inicial: ${[0,1,2].map(i=>EVENTS[i][0]).join('; ')}.</p><p>A tua seleção: ${(l.selected||[]).map(i=>EVENTS[i][0]).join('; ')||'Ainda não construída'}.</p><p>Oito momentos disponíveis; três podem ser publicados. A seleção não permite concluir como foi a semana inteira.</p>`;if(id==='rewards')return `<div class="tablewrap"><table><thead><tr><th>Máquina</th><th>Ações</th><th>Símbolos</th><th>Vontade de continuar</th></tr></thead><tbody>${['a','b'].map(k=>`<tr><td>${k.toUpperCase()}</td><td>${l[k]||0}/12</td><td>${schedules[k].filter(n=>n<=(l[k]||0)).length}</td><td>${l[k==='a'?'ratingA':'ratingB']?l[k==='a'?'ratingA':'ratingB']+' / 5':'Ainda não registada'}</td></tr>`).join('')}</tbody></table></div><p>A distribuição foi preparada: A = 3, 6, 9, 12; B = 2, 3, 8, 12. As avaliações de vontade são autorrelatos nesta atividade.</p>`;if(id==='bubble')return `${(l.runs||[]).map((x,i)=>`<p>Configuração ${i+1}: personalização ${x.level}%${x.diverse?', diversidade garantida':''}.</p>${distribution(x.counts)}`).join('')||'<p>Ainda não foram registados feeds.</p>'}<p>As contagens referem-se às três perspetivas do modelo. Alterar o feed não demonstra, por si, uma alteração de crenças.</p>`;if(id==='privacy')return `<p>Configurações auditadas: ${new Set(l.audits||[]).size}.</p><p>Última seleção: ${(l.flags||[]).map((v,i)=>v?PERMS[i][0]:null).filter(Boolean).join(', ')||'nenhuma permissão opcional'}.</p><p>As alternativas manuais continuam disponíveis. As condições de retenção, acesso e partilha teriam de ser esclarecidas num serviço real.</p>`;if(id==='ai')return l.checked?`<p>${l.labels.filter((v,i)=>v===CLAIMS[i][1]).length} de 4 classificações coincidiram com a análise.</p><p>Uma afirmação era sustentada, duas extrapolavam e uma contrariava o dossier. O tom não alterava a evidência.</p>`:'<p>A análise das respostas ainda não foi concluída.</p>';return ''}
function passport(){notice('');cancelTrial();current=null;screen='passport';const done=ROOMS.filter(r=>S.rooms[r.id].done).length;$('view').innerHTML=`<section class="roomhead"><div><div class="eyebrow">O teu caderno de descoberta</div><h1>Passaporte de exploração</h1><p>${done} de 6 salas exploradas. Os carimbos assinalam percursos concluídos; as reflexões tornam visível o teu raciocínio.</p></div><div class="seal">${done}/6<small>SALAS</small></div></section><div class="tools"><button id="export" class="primary">Exportar progresso</button><button id="import">Importar progresso</button><button id="print">Imprimir passaporte</button><button id="resetAll">Apagar progresso</button></div><p class="muted" style="font-size:.85rem">A exportação inclui previsões, experiências concluídas e reflexões. Não inclui uma ronda de atenção que ainda esteja em curso. Os ficheiros são guardados por ti; nada é enviado para um servidor.</p>${done===6?'<div class="feedback ok"><strong>As seis portas estão abertas.</strong><p>Escolhe uma ideia que mudaria uma decisão tua sobre tecnologia. Podes regressar às salas para testar outra previsão ou discutir resultados diferentes.</p></div>':''}<div class="stamps">${ROOMS.map(r=>{const d=S.rooms[r.id];return `<article class="passportcard ${d.done?'':'pending'}"><div class="stamp">${r.n}<small>${d.done?'EXPLORADA':'POR EXPLORAR'}</small></div><h3>${r.title}</h3><p class="muted">${r.concept}</p>${d.done?`<small>Visita concluída: ${d.date.split('-').reverse().join('/')}</small>`:''}<p><button class="small" data-room="${r.id}">${d.done?'Revisitar':'Continuar'} →</button></p></article>`}).join('')}</div><h2 style="margin-top:40px">O que levas contigo?</h2>${ROOMS.filter(r=>S.rooms[r.id].pred!==null).map(r=>{const d=S.rooms[r.id];return `<details><summary>${r.n} · ${r.title}</summary><p><strong>Previsão:</strong> ${esc(r.pred[d.pred])}</p>${summary(r.id,d.lab)}<p><strong>Reflexão:</strong></p><p class="journal">${d.note?esc(d.note):'Ainda não registaste uma reflexão. Podes fazê-lo na etapa «Observa».'}</p>${d.choice!==null?`<p><strong>Aplicação escolhida:</strong> ${esc(r.choices[d.choice][0])}</p><p>${esc(r.choices[d.choice][1])}</p>`:''}<p><strong>Ideia a reter:</strong> ${r.bridge}</p></details>`}).join('')||'<p class="muted">As tuas primeiras previsões aparecerão aqui depois de entrares numa sala.</p>'}`;document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>openRoom(b.dataset.room));$('export').onclick=exportProgress;$('import').onclick=()=>$('importFile').click();$('print').onclick=printPassport;$('resetAll').onclick=()=>{if(confirm('Apagar as seis salas, reflexões e carimbos? Exporta primeiro se quiseres guardar uma cópia.')){S.rooms=Object.fromEntries(ROOMS.map(r=>[r.id,blank()]));save();passport();notice('Progresso apagado. Podes iniciar uma nova visita.')}};}
function exportProgress(){const blob=new Blob([JSON.stringify({app:'museu-psicodigital',version:VERSION,exportedAt:new Date().toISOString(),...S},null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='museu-digital-passaporte.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);notice('Passaporte exportado. Guarda o ficheiro para retomar noutro dispositivo.')}
$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>250000)throw Error('Ficheiro demasiado grande');const fresh=sanitize(JSON.parse(await f.text()));if(!confirm('Substituir o progresso atual pelo passaporte importado?'))return;cancelTrial();S=fresh;prefs();save();passport();notice('Passaporte importado. Podes continuar a visita.')}catch(err){notice('Não foi possível importar este ficheiro. O progresso atual foi mantido. Escolhe uma exportação deste museu.')}finally{e.target.value=''}};
function printPassport(){const done=ROOMS.filter(r=>S.rooms[r.id].done).length;$('printout').innerHTML=`<h1>Por Dentro do Digital</h1><h2>Passaporte de exploração</h2><p>Psicologia na Transição Digital · 3.º ano</p><p>${done} de 6 salas exploradas. Carimbos de participação, sem classificação.</p><p>Nome (opcional): ____________________________________</p><p>Experiências e documentos fictícios. Os resultados não constituem avaliação psicológica.</p>${ROOMS.map(r=>{const d=S.rooms[r.id];return `<section class="printroom"><h2>${r.n} · ${r.title}</h2><p>${r.cp}</p><p><strong>Estado:</strong> ${d.done?'Explorada':'Por concluir'}</p><p><strong>Previsão:</strong> ${d.pred!==null?esc(r.pred[d.pred]):'Não registada'}</p>${Object.keys(d.lab).length?summary(r.id,d.lab):'<p>Experiência por iniciar.</p>'}<p><strong>Reflexão:</strong><br>${esc(d.note)||'______________________________________________________________________\n\n______________________________________________________________________'}</p><p><strong>Aplicação:</strong> ${d.choice!==null?esc(r.choices[d.choice][0]):'Não registada'}</p>${d.choice!==null?`<p><strong>Feedback à aplicação:</strong> ${esc(r.choices[d.choice][1])}</p>${d.choice!==r.best?`<p><strong>Proposta mais robusta:</strong> ${esc(r.choices[r.best][0])}</p>`:''}`:''}<p><strong>Ideia a reter:</strong> ${r.bridge}</p><p><strong>Limite:</strong> ${r.pitfall}</p></section>`}).join('')}`;window.print()}
window.addEventListener('beforeprint',()=>{if(!$('printout').innerHTML)$('printout').innerHTML='<h1>Por Dentro do Digital</h1><p>Abre o passaporte e usa «Imprimir passaporte» para preparar o registo completo.</p>'});
$('map').onclick=()=>{map();focusView()};$('passport').onclick=()=>{passport();focusView()};map();if(!saved)notice('Não foi possível recuperar o armazenamento local. Podes explorar e exportar o passaporte.');

</script></body></html>
